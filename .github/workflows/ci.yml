name: PALindrome CI
on: [ push, pull_request ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [ debug, release, sanitize ]
    steps:
      - uses: actions/checkout@v6
      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -y
          sudo apt-get install -y gcc-15 g++-15
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: env CTEST_PARALLEL_LEVEL=$(nproc) ctest --preset ${{ matrix.preset }}

  # The runners have AVX2, so -march=native never compiles the scalar fallback
  # tiers (the DSP kernels' non-AVX2 paths, and the WASM target's whole world).
  # Build and test the plain x86-64 baseline so those paths stay honest.
  build-and-test-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -y
          sudo apt-get install -y gcc-15 g++-15
      - name: Configure
        run: cmake --preset release -DPALINDROME_ARCH=x86-64
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: env CTEST_PARALLEL_LEVEL=$(nproc) ctest --preset release

  # Renders the corpus clips and compares desensitised hashes against
  # tests/golden.txt, so a picture-changing PR fails until it re-blesses the
  # manifest (tools/golden.py) in the same diff.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Install GCC 15 and Python imaging deps
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -y
          sudo apt-get install -y gcc-15 g++-15 python3-pil python3-numpy
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Golden check
        run: tools/golden.py check

  check-pre-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pipx install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
